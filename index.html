<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Smagul Madina</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:#14121f;color:#eee}
h1{text-align:center;margin:18px 0 6px;font-size:26px}
.wrap{display:flex;flex-wrap:wrap;gap:24px;justify-content:center;padding:16px}
.card{background:#1f1c30;border-radius:18px;padding:16px;width:min(420px,100%)}
.title{width:100%;background:transparent;border:none;color:#ffd166;font-size:20px;font-weight:700;text-align:center;margin-bottom:8px}
.wheelbox{position:relative;width:100%;aspect-ratio:1}
canvas{width:100%;height:100%}
.ptr{position:absolute;top:-6px;left:50%;transform:translateX(-50%);width:0;height:0;border-left:14px solid transparent;border-right:14px solid transparent;border-top:28px solid #fff;filter:drop-shadow(0 2px 3px #0008)}
button{cursor:pointer;border:none;border-radius:10px;font-weight:700}
.spin{width:100%;padding:14px;margin:12px 0;background:#ef476f;color:#fff;font-size:18px}
.spin:disabled{opacity:.5}
.res{text-align:center;min-height:28px;font-size:20px;color:#06d6a0;font-weight:700}
.add{display:flex;gap:6px;margin-top:8px}
.add input{flex:1;padding:10px;border-radius:10px;border:1px solid #444;background:#2a2640;color:#fff;font-size:16px}
.add button{padding:0 16px;background:#06d6a0;color:#000;font-size:20px}
ul{list-style:none;padding:0;margin:10px 0 0;max-height:220px;overflow:auto}
li{display:flex;align-items:center;gap:8px;padding:6px 8px;border-radius:8px;background:#2a2640;margin-bottom:4px}
li span{flex:1;word-break:break-word}
li .dot{width:12px;height:12px;border-radius:50%;flex:none}
li button{background:#444;color:#fff;padding:4px 9px}
.clear{margin-top:6px;background:transparent;color:#999;font-weight:400;text-decoration:underline}
</style></head><body>
<h1>🎡 Smagul Madina</h1>
<div class="wrap" id="wrap"></div>
<script>
const COLORS=['#ef476f','#ffd166','#06d6a0','#118ab2','#9b5de5','#f15bb5','#fee440','#00bbf9','#00f5d4','#fb5607'];
function load(k,d){try{return JSON.parse(localStorage.getItem(k))||d}catch(e){return d}}
function save(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}
function makeWheel(id,defTitle,defItems){
  const st=load('wheel'+id,{title:defTitle,items:defItems});
  const c=document.createElement('div');c.className='card';
  c.innerHTML=`<input class="title" value=""><div class="wheelbox"><div class="ptr"></div><canvas width="800" height="800"></canvas></div>
  <button class="spin">Крутить!</button><div class="res"></div>
  <div class="add"><input placeholder="Новый вариант…"><button>+</button></div><ul></ul><button class="clear">Очистить всё</button>`;
  document.getElementById('wrap').appendChild(c);
  const [titleI,addI]=c.querySelectorAll('input'),cv=c.querySelector('canvas'),ctx=cv.getContext('2d'),
    spinB=c.querySelector('.spin'),res=c.querySelector('.res'),ul=c.querySelector('ul'),addB=c.querySelector('.add button');
  titleI.value=st.title;titleI.oninput=()=>{st.title=titleI.value;save('wheel'+id,st)};
  let rot=0,spinning=false;
  function draw(){
    const n=st.items.length,R=390;ctx.clearRect(0,0,800,800);ctx.save();ctx.translate(400,400);ctx.rotate(rot);
    if(!n){ctx.fillStyle='#2a2640';ctx.beginPath();ctx.arc(0,0,R,0,7);ctx.fill();ctx.restore();
      ctx.fillStyle='#888';ctx.font='32px system-ui';ctx.textAlign='center';ctx.fillText('Добавьте варианты',400,410);return}
    const a=2*Math.PI/n;
    st.items.forEach((t,i)=>{ctx.beginPath();ctx.moveTo(0,0);ctx.arc(0,0,R,i*a,(i+1)*a);ctx.fillStyle=COLORS[i%COLORS.length];
      if(n>1&&i===n-1&&i%COLORS.length===0)ctx.fillStyle=COLORS[3];ctx.fill();ctx.strokeStyle='#14121f';ctx.lineWidth=3;ctx.stroke();
      ctx.save();ctx.rotate(i*a+a/2);ctx.textAlign='right';ctx.textBaseline='middle';ctx.fillStyle='#111';
      const fs=Math.max(14,Math.min(36,a*R*0.45));ctx.font=`bold ${fs}px system-ui`;
      let s=t;while(ctx.measureText(s).width>R-80&&s.length>1)s=s.slice(0,-1);if(s!==t)s=s.slice(0,-1)+'…';
      ctx.fillText(s,R-20,0);ctx.restore()});
    ctx.restore();ctx.beginPath();ctx.arc(400,400,40,0,7);ctx.fillStyle='#fff';ctx.fill();
  }
  function list(){ul.innerHTML='';st.items.forEach((t,i)=>{const li=document.createElement('li');
    li.innerHTML=`<div class="dot" style="background:${COLORS[i%COLORS.length]}"></div><span></span><button>✕</button>`;
    li.querySelector('span').textContent=t;li.querySelector('button').onclick=()=>{st.items.splice(i,1);upd()};ul.appendChild(li)});
    spinB.disabled=st.items.length<2}
  function upd(){save('wheel'+id,st);list();draw()}
  function add(){const v=addI.value.trim();if(!v)return;st.items.push(v);addI.value='';addI.focus();upd()}
  addB.onclick=add;addI.onkeydown=e=>{if(e.key==='Enter')add()};
  c.querySelector('.clear').onclick=()=>{if(st.items.length&&confirm('Удалить все варианты?')){st.items=[];res.textContent='';upd()}};
  spinB.onclick=()=>{if(spinning||st.items.length<2)return;spinning=true;spinB.disabled=true;res.textContent='';
    const start=rot,target=start+Math.PI*2*(6+Math.random()*4)+Math.random()*Math.PI*2,dur=5000,t0=performance.now();
    (function f(now){const p=Math.min(1,(now-t0)/dur),e=1-Math.pow(1-p,4);rot=start+(target-start)*e;draw();
      if(p<1)requestAnimationFrame(f);else{spinning=false;spinB.disabled=false;const n=st.items.length,a=2*Math.PI/n;
        const ang=((-Math.PI/2-rot)%(2*Math.PI)+2*Math.PI)%(2*Math.PI);res.textContent='🎉 '+st.items[Math.floor(ang/a)]}})(t0)};
  upd();
}
makeWheel(1,'Колесо 1',['Вариант 1','Вариант 2','Вариант 3','Вариант 4']);
makeWheel(2,'Колесо 2',['Да','Нет','Может быть']);
</script></body></html>
